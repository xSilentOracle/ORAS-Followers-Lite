name: Validate PICA transparency pipeline
on:
  push:
    branches: [pica-sprite-compositor-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frag-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native PICA texenv and blend state
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror lite/PicaPackets.cpp \
            lite/PicaSpriteFragment.cpp tests/test_sprite_fragment.cpp -o /tmp/test_fragment
      - name: Validate transparency and fragment state
        run: /tmp/test_fragment
