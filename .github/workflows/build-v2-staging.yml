name: Compile isolated PICA v2 pack decoding stage
on:
  push:
    branches: [pica-sprite-compositor-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - uses: actions/checkout@v4
      - name: Assemble isolated PICA game plugin from pinned ORAS source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/SamuTecYT/ORAS-MMO.git upstream
          git -C upstream checkout e19a19bf4aa287f49ce6072c53b4eb8e9b13bbad
          cp lite/pica_main.cpp upstream/3ds_plugin/Sources/main.cpp
          cp lite/GpuFollower.cpp upstream/3ds_plugin/Sources/GpuFollower.cpp
          cp lite/GpuFollower.hpp upstream/3ds_plugin/Includes/GpuFollower.hpp
          cp lite/PicaFrameCodec.cpp upstream/3ds_plugin/Sources/PicaFrameCodec.cpp
          cp lite/PicaFrameCodec.hpp upstream/3ds_plugin/Includes/PicaFrameCodec.hpp
          cp lite/GxQueuePlan.cpp upstream/3ds_plugin/Sources/GxQueuePlan.cpp
          cp lite/GxQueuePlan.hpp upstream/3ds_plugin/Includes/GxQueuePlan.hpp
          cp lite/GxQueueBridge.cpp upstream/3ds_plugin/Sources/GxQueueBridge.cpp
          cp lite/GxQueueBridge.hpp upstream/3ds_plugin/Includes/GxQueueBridge.hpp
          cp lite/PicaPackets.cpp upstream/3ds_plugin/Sources/PicaPackets.cpp
          cp lite/PicaPackets.hpp upstream/3ds_plugin/Includes/PicaPackets.hpp
          cp lite/PicaVertexUpload.cpp upstream/3ds_plugin/Sources/PicaVertexUpload.cpp
          cp lite/PicaVertexUpload.hpp upstream/3ds_plugin/Includes/PicaVertexUpload.hpp
          cp lite/SpriteQuad.cpp upstream/3ds_plugin/Sources/SpriteQuad.cpp
          cp lite/SpriteQuad.hpp upstream/3ds_plugin/Includes/SpriteQuad.hpp
          cp lite/PicaDrawArrays.cpp upstream/3ds_plugin/Sources/PicaDrawArrays.cpp
          cp lite/PicaDrawArrays.hpp upstream/3ds_plugin/Includes/PicaDrawArrays.hpp
          cp lite/PicaSpriteSetup.cpp upstream/3ds_plugin/Sources/PicaSpriteSetup.cpp
          cp lite/PicaSpriteSetup.hpp upstream/3ds_plugin/Includes/PicaSpriteSetup.hpp
          cp lite/PicaSpriteList.cpp upstream/3ds_plugin/Sources/PicaSpriteList.cpp
          cp lite/PicaSpriteList.hpp upstream/3ds_plugin/Includes/PicaSpriteList.hpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/3ds_plugin/Sources/Overlay.cpp')
          source=p.read_text()
          needle='} // namespace Overlay'
          assert source.count(needle)==1
          source=source.replace('#include "Overlay.hpp"', '#include "Overlay.hpp"\n#include "GpuFollower.hpp"',1)
          extra=Path('lite/follower_overlay.inc').read_text()
          assert 'if (!MakeTarget(screen, target)) {' in extra
          extra=extra.replace('if (!screen.IsTop || s_hold) return false;', 'if (!screen.IsTop || s_hold) { GpuFollower::Clear(); return false; }')
          extra=extra.replace('if (!MakeTarget(screen, target)) {\n        s_busy = false;\n        return false;\n    }', 'GpuFollower::ScratchTarget(target);')
          extra=extra.replace('        s_busy = false;\n        return false;', '        s_busy = false;\n        GpuFollower::Clear();\n        return false;')
          assert extra.count('    return drew;')==1
          extra=extra.replace('    return drew;', '    GpuFollower::Publish(drew);\n    return false;')
          p.write_text(source.replace(needle,extra+'\n'+needle))
          header=Path('upstream/3ds_plugin/Includes/Overlay.hpp')
          data=header.read_text()
          target='bool OnFrame(const CTRPluginFramework::Screen &screen);'
          assert target in data
          header.write_text(data.replace(target,target+'\nbool OnFollowerOnlyFrame(const CTRPluginFramework::Screen &screen);'))
          make=Path('upstream/3ds_plugin/Makefile')
          m=make.read_text()
          assert '-std=gnu++11' in m
          make.write_text(m.replace('-std=gnu++11','-std=gnu++17'))
          meta=Path('upstream/3ds_plugin/CTRPluginFramework.plgInfo')
          t=meta.read_text().replace('Pokemon ORAS MMO v17.0','ORAS GPU Pokemon Experiment')
          meta.write_text(t)
          PY
      - name: Install pinned 3GX toolchain only
        shell: bash
        run: |
          set -euo pipefail
          echo 'No Citro2D/Citro3D: hardware command submission is disabled in this build'
          CONF=$(dkp-pacman -v -Q 2>/dev/null | sed -n 's/^Conf File *: *//p' | head -n 1)
          [ -n "$CONF" ] || CONF=/opt/devkitpro/pacman/etc/pacman.conf
          awk '/^\[/ { keep = ($0 == "[options]") } keep' "$CONF" > /tmp/ctrpf.conf
          printf '\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional\n' >> /tmp/ctrpf.conf
          printf '\n[thepixellizeross-linux]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/linux\nSigLevel = Optional\n' >> /tmp/ctrpf.conf
          mkdir -p /tmp/pkgs
          dkp-pacman --config /tmp/ctrpf.conf -Syw --noconfirm --cachedir /tmp/pkgs libctrpf 3gxtool
          cd /tmp/pkgs
          printf '%s\n' \
            'af324bc6c27a5bee817bf7f3a3413b926891913254bb1d9abe09edbfb83d06b1  libctrpf-0.8.0.r1444-1-any.pkg.tar.zst' \
            'ce691228a76e159ea14c0716f8169584a49ffcaaa1005158664567ede9dccd4c  3gxtool-1.3-1-x86_64.pkg.tar.zst' > pinned.sha256
          sha256sum -c pinned.sha256
          dkp-pacman --config /tmp/ctrpf.conf -U --noconfirm libctrpf-0.8.0.r1444-1-any.pkg.tar.zst 3gxtool-1.3-1-x86_64.pkg.tar.zst
      - name: Cross-compile all-species decoding and CPU staging only
        shell: bash
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          set -euo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make -C upstream/3ds_plugin
          test -s upstream/3ds_plugin/3ds_plugin.3gx
          mkdir -p out
          cp upstream/3ds_plugin/3ds_plugin.3gx out/OrasPicaV2CpuStage.3gx
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OrasPicaV2CpuStage-3gx
          path: out/OrasPicaV2CpuStage.3gx
          retention-days: 14
