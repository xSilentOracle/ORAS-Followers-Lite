name: Validate textured PICA sprite geometry
on:
  push:
    branches: [pica-sprite-compositor-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-quad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile pure 3DS billboard vertex generator
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror lite/SpriteQuad.cpp tests/test_sprite_quad.cpp -o /tmp/sprite_quad_test
      - name: Verify UV coordinates and rotation
        run: /tmp/sprite_quad_test
  shader-asm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned picasso assembler from source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool
          git clone https://github.com/devkitPro/picasso.git /tmp/picasso
          git -C /tmp/picasso checkout d522455ea59cd5cb9219c699b93eb7750039233c
          cd /tmp/picasso
          ./autogen.sh
          ./configure --prefix=/tmp/picasso-installed
          make -j2
          make install
      - name: Assemble PICA pass-through vertex shader
        run: |
          /tmp/picasso-installed/bin/picasso -o /tmp/sprite.shbin lite/sprite_shader.v.pica
          test -s /tmp/sprite.shbin
          wc -c /tmp/sprite.shbin
